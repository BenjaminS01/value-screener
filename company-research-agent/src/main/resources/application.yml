spring:
  application:
    name: company-research-agent
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        # Haiku models don't support Programmatic Tool Calling, which the hosted web_search
        # tool now requires by default (discovered during Task 7's manual wire-level check;
        # see the design spec's Decision log). Spring AI 2.0.0's AnthropicWebSearchTool
        # builder has no allowedCallers override, so the model choice is the only lever.
        model: claude-sonnet-5
    mcp:
      server:
        name: company-research-agent
        version: 0.1.0
        protocol: STREAMABLE
        type: SYNC
        annotation-scanner:
          enabled: true

research:
  agent:
    # 55s (the original guess) was too tight: a real Sonnet 5 call with web_search
    # issues multiple search queries before synthesizing the answer, confirmed
    # during Task 7's manual wire-level check to routinely exceed it for AAPL.
    # 120s was still too tight for Stage 2 specifically: a live research_company(AAPL) call
    # (up to 5 web searches at MEDIUM effort, synthesizing 8 criteria) hit this timeout with
    # no result on 2026-08-08. Once this fires, the underlying Anthropic request is NOT
    # actually cancelled (see callWithTimeout's comment) -- it keeps running and billing, but
    # the result is unrecoverable, so this must be generous enough to avoid that outcome.
    timeout-seconds: 240
    # Bounds worst-case cost/latency per research call: without this, the model can
    # issue an unlimited number of web_search calls. A local timeout does NOT stop
    # the underlying (billed) Anthropic request either -- see the Decision log.
    # Lowered 5 -> 3 (2026-08-10): a live Stage 2 call at 5 timed out twice (120s, then
    # 240s) with no recoverable result -- see the Decision log entry "Stage 2 prompt/cost
    # simplification" in the design spec. Accepted tradeoff: less recall on multi-round
    # disambiguation cases (one earlier simulation needed 7 rounds for AAPL's fiscal-quarter
    # labeling) in favor of calls that actually complete.
    web-search-max-uses: 3
    # Cost/quality measure 1 (agent spec Section 4/5.4): restricts search to primary filings and
    # established financial data sources instead of open web search. Starting list, calibrated
    # further once real search volume exists (agent spec Section 9, open item 6).
    # reuters.com and wsj.com removed 2026-08-02: Anthropic's web_search crawler cannot access them
    # (confirmed via a real 400 invalid_request_error during the first live test call), and the API
    # rejects the ENTIRE call if even one allowed-domains entry is inaccessible to its user agent.
    allowed-domains: sec.gov,www.sec.gov,stockanalysis.com,marketscreener.com,finance.yahoo.com,morningstar.com,macrotrends.net,boerse-frankfurt.de,finanzen.net,globenewswire.com,prnewswire.com,businesswire.com
