spring:
  application:
    name: value-screener-backend
  cloud:
    aws:
      # Spring Cloud AWS (SSM) is only used with profile "aws"; off elsewhere so local runs and tests
      # never build AWS clients or need credentials.
      parameterstore:
        enabled: false

server:
  servlet:
    session:
      timeout: 2h
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: strict
        secure: true

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  users: []
  security:
    trust-forwarded-for: false
  research-ingest:
    enabled: false
  research-sync:
    enabled: false
  deep-analysis:
    mode: lambda
    function-name: deep-analysis-demo
    region: eu-central-1
  dynamodb:
    seed-groups: ${APP_DYNAMODB_SEED_GROUPS:false}
    table-name: ${APP_DYNAMODB_TABLE_NAME:value-screener}
    endpoint: ${APP_DYNAMODB_ENDPOINT:}
    region: eu-central-1
    create-table: ${APP_DYNAMODB_CREATE_TABLE:false}
  limits:
    deep-analysis-per-user: 5
    deep-analysis-per-admin: 20
    global-per-day: 100

research:
  stale-after: P9M
