services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.4
    # the image runs as uid 1000 but a fresh named volume is root-owned; root lets it write its data dir
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "127.0.0.1:8000:8000"   # DynamoDB Local has no authentication: loopback only
    volumes:
      - value-screener-dynamodb-data:/home/dynamodblocal/data

volumes:
  value-screener-dynamodb-data:
